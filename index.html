<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>복셀 크래프트</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' fill='%23795433'/><rect width='16' height='5' fill='%235d9c3c'/></svg>">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="app">
  <div id="worldZone"></div>

  <div id="crosshair"></div>
  <div id="damageOverlay"></div>
  <div id="waterOverlay"></div>

  <div id="hud">
    <div id="statusBars">
      <div id="airRow" class="iconRow hidden"></div>
      <div id="foodRow" class="iconRow"></div>
      <div id="healthRow" class="iconRow"></div>
    </div>
    <div id="heldLabel" class="hidden"></div>
    <div id="hotbar"></div>
  </div>

  <div id="joystickZone">
    <div id="joystickBase"></div>
    <div id="joystickKnob"></div>
  </div>

  <div id="rightControls">
    <button id="btnFlyUp" class="rbtn hidden">▲</button>
    <button id="btnFlyDown" class="rbtn hidden">▼</button>
    <button id="btnJump" class="rbtn jump">점프</button>
  </div>

  <div id="topRight">
    <button id="btnFly" class="rbtn hidden">✈</button>
    <button id="btnInventory" class="rbtn">🎒</button>
    <button id="btnDebug" class="rbtn">ℹ</button>
  </div>

  <div id="debugPanel" class="hidden"></div>
  <div id="hint" class="hidden"></div>

  <div id="inventoryScreen" class="overlay hidden">
    <h1 id="invTitle">인벤토리</h1>
    <div id="invBody"></div>
    <button id="invClose" class="bigBtn ghost">닫기</button>
  </div>

  <div id="deathScreen" class="overlay hidden">
    <h2>당신은 죽었습니다</h2>
    <p>가지고 있던 아이템은 죽은 자리에 떨어졌습니다.</p>
    <button class="bigBtn" data-respawn-mode="survival">서바이벌로 부활</button>
    <button class="bigBtn alt" data-respawn-mode="creative">크리에이티브로 전환</button>
  </div>

  <div id="loadingScreen" class="overlay hidden">
    <h1>복셀 크래프트</h1>
    <p id="loadingText">세계를 만드는 중...</p>
  </div>

  <div id="menuScreen" class="overlay">
    <h1>복셀 크래프트</h1>
    <p>아이패드 터치로 즐기는 복셀 세계. 무한 지형, 강과 바다, 숲과 사막, 동굴과 광석이 기다립니다.</p>
    <input id="seedInput" type="text" placeholder="시드 (비우면 랜덤)" autocomplete="off">
    <button class="bigBtn" data-start-mode="survival">서바이벌 시작</button>
    <button class="bigBtn alt" data-start-mode="creative">크리에이티브 시작</button>
    <p>서바이벌: 체력·배고픔·산소, 중력과 낙하 피해, 블록을 캐서 모읍니다.<br>
       크리에이티브: 비행, 무한 블록, 피해 없음.</p>
  </div>
</div>

<script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
<script src="js/noise.js"></script>
<script src="js/textures.js"></script>
<script src="js/blocks.js"></script>
<script src="js/world.js"></script>
<script src="js/player.js"></script>
<script src="js/inventory.js"></script>
<script src="js/controls.js"></script>
<script src="js/ui.js"></script>
<script src="js/game.js"></script>
</body>
</html>
