<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>복셀 크래프트</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' fill='%23795433'/><rect width='16' height='5' fill='%235d9c3c'/></svg>">
<link rel="stylesheet" href="css/style.css?v=12">
<script>
// GitHub Pages caches this page for ten minutes, so a new build can sit
// unseen. Ask an uncached version file and reload once if we are behind.
(function () {
  var BUILD = 12;
  try {
    fetch('version.json?t=' + Date.now(), { cache: 'no-store' })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (!d || d.v === BUILD) return;
        if (sessionStorage.getItem('vxlBuild') === String(d.v)) return;
        sessionStorage.setItem('vxlBuild', String(d.v));
        location.replace(location.pathname + '?b=' + d.v);
      })
      .catch(function () { /* offline: keep playing what we have */ });
  } catch (e) { /* no fetch or storage: ignore */ }
})();
</script>
</head>
<body>

<div id="app">
  <div id="worldZone"></div>

  <div id="damageOverlay"></div>
  <div id="waterOverlay"></div>

  <div id="hud">
    <div id="heldLabel" class="hidden"></div>
    <div id="statusBars">
      <div class="barSide">
        <div id="armorRow" class="iconRow hidden"></div>
        <div id="healthRow" class="iconRow"></div>
      </div>
      <div class="barSide right">
        <div id="airRow" class="iconRow hidden"></div>
        <div id="foodRow" class="iconRow"></div>
      </div>
    </div>
    <div id="hotbarRow">
      <div id="hotbar"></div>
      <button id="btnInventory" class="mcbtn small" aria-label="인벤토리">
        <span class="dots"></span>
      </button>
    </div>
  </div>

  <div id="joystickZone"></div>
  <div id="joyVisual">
    <div id="joystickBase"></div>
    <div id="joystickKnob"></div>
  </div>

  <div id="rightControls">
    <button id="btnFlyUp" class="mcbtn hidden" aria-label="상승"><i class="chev up"></i></button>
    <button id="btnFlyDown" class="mcbtn hidden" aria-label="하강"><i class="chev down"></i></button>
    <button id="btnJump" class="mcbtn jump" aria-label="점프"><i class="chev up"></i></button>
  </div>

  <div id="topRight">
    <button id="btnRoom" class="mcbtn small hidden" aria-label="방">방</button>
    <button id="btnChat" class="mcbtn small hidden" aria-label="채팅">💬</button>
    <button id="btnFly" class="mcbtn small hidden" aria-label="비행">✈</button>
    <button id="btnDebug" class="mcbtn small" aria-label="정보">i</button>
  </div>

  <div id="debugPanel" class="hidden"></div>
  <div id="hint" class="hidden"></div>
  <div id="chatLog" class="hidden"></div>

  <div id="chatScreen" class="overlay hidden">
    <div id="chatPanel">
      <div id="chatHeader">
        <span>채팅</span>
        <span class="headerSpacer"></span>
        <button id="btnChatClose" class="panelBtn">닫기</button>
      </div>
      <div id="chatMessages"></div>
      <div id="chatInputRow">
        <input id="chatInput" type="text" maxlength="120" placeholder="메시지를 입력하세요" autocomplete="off">
        <button id="btnChatSend" class="panelBtn">보내기</button>
      </div>
    </div>
  </div>

  <div id="screen" class="overlay hidden">
    <div id="screenPanel">
      <div id="screenHeader">
        <span id="screenTitle">인벤토리</span>
        <span class="headerSpacer"></span>
        <button id="btnRecipeBook" class="panelBtn">제작법</button>
        <button id="screenClose" class="panelBtn">닫기</button>
      </div>
      <div id="screenBody"></div>
      <div id="heldFloat" class="hidden"></div>
    </div>
    <div id="recipeBook" class="hidden"></div>
  </div>

  <div id="deathScreen" class="overlay hidden">
    <h2>당신은 죽었습니다</h2>
    <p>가지고 있던 아이템은 죽은 자리에 떨어졌습니다.</p>
    <button class="bigBtn" data-respawn-mode="survival">부활하기</button>
    <button id="btnDeathCreative" class="bigBtn alt" data-respawn-mode="creative">크리에이티브로 전환</button>
  </div>

  <div id="loadingScreen" class="overlay hidden">
    <h1>복셀 크래프트</h1>
    <p id="loadingText">세계를 만드는 중...</p>
  </div>

  <div id="roomScreen" class="overlay hidden">
    <h1>방 정보</h1>
    <p>방 코드</p>
    <div id="roomCodeBig">------</div>
    <p id="roomHostNote"></p>
    <div id="roomPlayers"></div>
    <button id="btnLeaveRoom" class="bigBtn alt">방 나가기</button>
    <button id="btnRoomClose" class="bigBtn ghost">닫기</button>
  </div>

  <div id="menuScreen" class="overlay">
    <h1>복셀 크래프트</h1>
    <p class="buildTag">버전 v12</p>

    <div id="menuMain" class="menuPage">
      <p>무한 지형, 강과 바다, 숲과 사막, 동굴과 광석. 캐고, 만들고, 살아남으세요.</p>
      <input id="seedInput" type="text" placeholder="시드 (비우면 랜덤)" autocomplete="off">
      <button class="bigBtn" data-start-mode="survival">서바이벌 시작</button>
      <button class="bigBtn alt" data-start-mode="creative">크리에이티브 시작</button>
      <button id="btnMulti" class="bigBtn ghost">멀티플레이</button>
    </div>

    <div id="menuMulti" class="menuPage hidden">
      <p>친구와 같은 세계에서 함께 플레이합니다. 방장이 만든 코드를 친구에게 알려주세요.</p>
      <input id="nameInput" type="text" placeholder="닉네임" maxlength="12" autocomplete="off">
      <button id="btnGoCreate" class="bigBtn">방 만들기</button>
      <button id="btnGoJoin" class="bigBtn alt">코드로 참여하기</button>
      <button class="bigBtn ghost" data-menu-back="menuMain">뒤로</button>
    </div>

    <div id="menuCreate" class="menuPage hidden">
      <p>이 코드를 친구에게 알려주면 참여할 수 있어요. 직접 바꿔도 됩니다.</p>
      <input id="roomCodeInput" type="text" maxlength="8" autocomplete="off" autocapitalize="characters">
      <input id="mpSeedInput" type="text" placeholder="시드 (비우면 랜덤)" autocomplete="off">
      <button class="bigBtn" data-create-mode="survival">서바이벌로 방 만들기</button>
      <button class="bigBtn alt" data-create-mode="creative">크리에이티브로 방 만들기</button>
      <button class="bigBtn ghost" data-menu-back="menuMulti">뒤로</button>
    </div>

    <div id="menuJoin" class="menuPage hidden">
      <p>방장에게 받은 코드를 입력하세요.</p>
      <input id="joinCodeInput" type="text" maxlength="8" placeholder="방 코드" autocomplete="off" autocapitalize="characters">
      <button id="btnDoJoin" class="bigBtn">참여하기</button>
      <button class="bigBtn ghost" data-menu-back="menuMulti">뒤로</button>
    </div>

    <p id="netStatus" class="hidden"></p>
  </div>
</div>

<script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="js/noise.js?v=12"></script>
<script src="js/textures.js?v=12"></script>
<script src="js/blocks.js?v=12"></script>
<script src="js/items.js?v=12"></script>
<script src="js/recipes.js?v=12"></script>
<script src="js/world.js?v=12"></script>
<script src="js/player.js?v=12"></script>
<script src="js/inventory.js?v=12"></script>
<script src="js/net.js?v=12"></script>
<script src="js/controls.js?v=12"></script>
<script src="js/ui.js?v=12"></script>
<script src="js/game.js?v=12"></script>
</body>
</html>
